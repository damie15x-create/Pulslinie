<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard-Patch</title>
<style>
body{font:16px/1.55 system-ui,sans-serif;max-width:640px;margin:40px auto;padding:0 16px;color:#12263a;background:#f4f6f8}
h1{font-size:26px;margin:0 0 8px}
.box{background:#fff;border:2px dashed #9fb3c4;border-radius:12px;padding:28px;text-align:center;margin:20px 0}
button{font:inherit;padding:10px 18px;border-radius:8px;border:0;background:#12263a;color:#fff;cursor:pointer}
ul{padding-left:20px}.ok{color:#1d7a46}.skip{color:#a05a00}.err{color:#b3261e}
</style>
</head>
<body>
<h1>Dashboard-Patch</h1>
<p>Wähle deine Datei <b>Körper und Training.html</b> aus. Das Werkzeug baut die Änderungen ein und lädt die neue Datei herunter. Deine Originaldatei bleibt unverändert, nichts wird hochgeladen.</p>
<div class="box"><input type="file" id="f" accept=".html"></div>
<div id="out" aria-live="polite"></div>
<script>
const out=document.getElementById('out');
function patch(t){
 const log=[];let s=t;
 const step=(name,fn)=>{const r=fn();log.push([name,r])};
 const rep=(a,b)=>{if(!s.includes(a))return false;s=s.split(a).join(b);return true};
 step('Abschnitt „Frag dein Dashboard“ ausgeblendet',()=>{
  if(s.includes('id="ask" hidden'))return'schon erledigt';
  return rep('<section class="panel sec" id="ask">','<section class="panel sec" id="ask" hidden>')?'ok':'nicht gefunden'});
 step('Abschnitt „Wochenplan“ ausgeblendet',()=>{
  if(s.includes('id="plan" hidden'))return'schon erledigt';
  return rep('<section class="panel sec" id="plan">','<section class="panel sec" id="plan" hidden>')?'ok':'nicht gefunden'});
 step('Knopf „Alle Daten löschen“ eingefügt',()=>{
  if(s.includes('id="bkdel"'))return'schon erledigt';
  return rep('<button class="gl" id="bkload" type="button">Sicherung laden</button>','<button class="gl" id="bkload" type="button">Sicherung laden</button><button class="gl" id="bkdel" type="button">Alle Daten löschen</button>')?'ok':'nicht gefunden'});
 step('Löschfunktion eingefügt',()=>{
  if(s.includes("$('#bkdel').onclick"))return'schon erledigt';
  const fn="$('#bkdel').onclick=()=>{\n if(!confirm('Alle in diesem Browser gespeicherten Daten löschen? Das lässt sich nicht rückgängig machen. Mach vorher eine Sicherung, wenn du sie noch brauchst.'))return;\n try{localStorage.clear();indexedDB.deleteDatabase('gd')}catch(e){}\n location.reload();\n};\n";
  const k="$('#planbtn').onclick=plan;";
  if(!s.includes(k))return'nicht gefunden';
  s=s.split(k).join(fn+k);return'ok'});
 step('Tab umbenannt in „Rückblick“',()=>{
  if(!s.includes('Rückblick und Fragen'))return'schon erledigt';
  return rep('Rückblick und Fragen','Rückblick')?'ok':'nicht gefunden'});
 step('Hinweis zum Speichern im Browser ergänzt',()=>{
  const a='Alles bleibt in deinem Browser.';
  if(s.includes('Du kannst sie unter „Daten sichern“ löschen'))return'schon erledigt';
  return rep(a,'Alles bleibt in deinem Browser und wird nicht an einen Server gesendet. Du kannst die Daten unter „Rückblick“ im Bereich „Daten sichern“ mit „Alle Daten löschen“ entfernen.')?'ok':'nicht gefunden'});
 return{s,log};
}
document.getElementById('f').onchange=async e=>{
 const file=e.target.files[0];if(!file)return;
 const text=await file.text();
 if(!text.includes('id="gd-embed"')){out.innerHTML='<p class="err">Das sieht nicht nach deinem Dashboard aus. Bitte wähle die Datei „Körper und Training.html“.</p>';return}
 const {s,log}=patch(text);
 out.innerHTML='<ul>'+log.map(([n,r])=>`<li class="${r=='ok'?'ok':r=='nicht gefunden'?'err':'skip'}">${n}: ${r}</li>`).join('')+'</ul><button id="dl">Neue Datei herunterladen</button>';
 document.getElementById('dl').onclick=()=>{
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'text/html'}));a.download=file.name;document.body.appendChild(a);a.click();a.remove();
 };
};
</script>
</body>
</html>
